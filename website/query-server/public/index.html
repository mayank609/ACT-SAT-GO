<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScoreπGo | Web Queries Hub</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #060e1a;
      --panel: rgba(13, 27, 49, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --gold: #f59b00;
      --gold-glow: rgba(245, 155, 0, 0.15);
      --navy: #0d2545;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      --pending: #eab308;
      --in-progress: #3b82f6;
      --contacted: #10b981;
      --resolved: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(13, 37, 69, 0.5) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(245, 155, 0, 0.04) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Header ──────────────────────────────────────────────────────── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, var(--gold), #ffc83b);
      color: #060e1a;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      box-shadow: 0 4px 20px var(--gold-glow);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-family: inherit;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #ffb300);
      color: #060e1a;
      border: none;
      box-shadow: 0 4px 14px var(--gold-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #ffb300, var(--gold));
      box-shadow: 0 6px 20px rgba(245, 155, 0, 0.35);
      transform: translateY(-1px);
    }

    /* ── Metrics Grid ────────────────────────────────────────────────── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .metric-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      transition: transform 0.2s, border-color 0.2s;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-hover);
    }

    .metric-title {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 32px;
      font-weight: 800;
      color: white;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ── Filters Band ────────────────────────────────────────────────── */
    .filters-band {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .search-input {
      flex: 1;
      min-width: 260px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .filter-groups {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .select-input {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .select-input:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .select-input option {
      background-color: var(--bg);
      color: white;
    }

    /* ── Queries Table/Card List ──────────────────────────────────────── */
    .table-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      padding: 18px 24px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }

    td {
      padding: 18px 24px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.015);
    }

    .client-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .client-name {
      font-weight: 700;
      color: white;
    }

    .client-email {
      font-size: 12px;
      color: var(--text-muted);
    }

    .type-badge {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(28, 95, 165, 0.15);
      border: 1px solid rgba(28, 95, 165, 0.25);
      color: #38bdf8;
    }

    .type-badge.newsletter {
      background: rgba(245, 155, 0, 0.1);
      border: 1px solid rgba(245, 155, 0, 0.2);
      color: var(--gold);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-Pending { color: var(--pending); background: rgba(234, 179, 8, 0.1); }
    .status-In-Progress { color: var(--in-progress); background: rgba(59, 130, 246, 0.1); }
    .status-Contacted { color: var(--contacted); background: rgba(16, 185, 129, 0.1); }
    .status-Resolved { color: var(--resolved); background: rgba(139, 92, 246, 0.1); }

    .status-select {
      background: transparent;
      border: none;
      color: inherit;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .message-preview {
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-muted);
    }

    .action-cell {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
      color: white;
    }

    .action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    /* ── Empty State ─────────────────────────────────────────────────── */
    .empty-state {
      padding: 80px 40px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 18px;
      color: white;
      margin-bottom: 8px;
      font-weight: 700;
    }

    /* ── Modal ───────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 9, 17, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #0d1b31;
      border: 1px solid var(--border-hover);
      border-radius: 20px;
      width: 100%;
      max-width: 540px;
      padding: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: white;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 20px;
    }

    .modal-close:hover {
      color: white;
    }

    .modal-field {
      margin-bottom: 18px;
    }

    .modal-field-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .modal-field-value {
      font-size: 14px;
      color: white;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
    }

    .modal-message {
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* ── Responsiveness ──────────────────────────────────────────────── */
    @media (max-width: 768px) {
      body { padding: 20px 10px; }
      header { flex-direction: column; gap: 16px; align-items: stretch; }
      .header-actions { justify-content: space-between; }
      table, thead, tbody, th, td, tr { display: block; }
      thead tr { position: absolute; top: -9999px; left: -9999px; }
      tr { border-bottom: 1px solid var(--border); padding: 16px 8px; }
      td { border: none; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; text-align: right; }
      td::before { content: attr(data-label); font-weight: 800; text-transform: uppercase; font-size: 11px; color: var(--text-muted); text-align: left; margin-right: 12px; }
      .client-info { align-items: flex-end; }
      .message-preview { max-width: 100%; white-space: normal; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-container">
        <span class="logo-badge">ScoreπGo</span>
        <div>
          <h1>Queries Admin Hub</h1>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" id="btn-refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Refresh
        </button>
        <button class="btn btn-primary" id="btn-export">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export CSV
        </button>
      </div>
    </header>

    <!-- Metrics Grid -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Total Submissions</div>
        <div class="metric-value" id="val-total">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Pending Action</div>
        <div class="metric-value" style="color: var(--pending);" id="val-pending">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Contacted / In Progress</div>
        <div class="metric-value" style="color: var(--contacted);" id="val-contacted">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Newsletter Subscribers</div>
        <div class="metric-value" style="color: var(--gold);" id="val-subscribers">0</div>
      </div>
    </section>

    <!-- Filters Band -->
    <section class="filters-band">
      <input type="text" class="search-input" id="search" placeholder="Search by name, email, or message details...">
      <div class="filter-groups">
        <select class="select-input" id="filter-type">
          <option value="All">All Types</option>
          <option value="Consultation">Consultations</option>
          <option value="Newsletter">Newsletters</option>
        </select>
        <select class="select-input" id="filter-status">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Contacted">Contacted</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>
    </section>

    <!-- Queries Table / Card List -->
    <section class="table-container">
      <table id="queries-table">
        <thead>
          <tr>
            <th>Client</th>
            <th>Type</th>
            <th>Exam</th>
            <th>Phone</th>
            <th>Message</th>
            <th>Date</th>
            <th>Status</th>
            <th style="width: 100px;">Actions</th>
          </tr>
        </thead>
        <tbody id="queries-list">
          <!-- Dynamically populated -->
        </tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display: none;">
        <h3>No submissions found</h3>
        <p>Form submissions and newsletter signups will appear here once submitted.</p>
      </div>
    </section>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Query Detailed View</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div id="modal-content">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/queries';
    let localQueries = [];

    // Fetch queries from server
    async function fetchQueries() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('API request failed');
        localQueries = await response.json();
        renderDashboard();
      } catch (error) {
        console.error('Error loading queries:', error);
      }
    }

    // Render metrics and list
    function renderDashboard() {
      const searchVal = document.getElementById('search').value.toLowerCase();
      const typeFilter = document.getElementById('filter-type').value;
      const statusFilter = document.getElementById('filter-status').value;

      // Filtered queries
      const filtered = localQueries.filter(q => {
        const matchesSearch = 
          q.name.toLowerCase().includes(searchVal) ||
          q.email.toLowerCase().includes(searchVal) ||
          q.message.toLowerCase().includes(searchVal) ||
          q.phone.toLowerCase().includes(searchVal);
        const matchesType = typeFilter === 'All' || q.type === typeFilter;
        const matchesStatus = statusFilter === 'All' || q.status === statusFilter;
        return matchesSearch && matchesType && matchesStatus;
      });

      // Update metrics
      document.getElementById('val-total').innerText = localQueries.length;
      document.getElementById('val-pending').innerText = localQueries.filter(q => q.status === 'Pending').length;
      document.getElementById('val-contacted').innerText = localQueries.filter(q => q.status === 'Contacted' || q.status === 'In Progress').length;
      document.getElementById('val-subscribers').innerText = localQueries.filter(q => q.type === 'Newsletter').length;

      // Populate list
      const listEl = document.getElementById('queries-list');
      const emptyEl = document.getElementById('empty-state');
      
      listEl.innerHTML = '';
      
      if (filtered.length === 0) {
        emptyEl.style.display = 'block';
        document.getElementById('queries-table').style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      document.getElementById('queries-table').style.display = 'table';

      filtered.forEach(q => {
        const tr = document.createElement('tr');
        
        // Date parsing
        const dateFormatted = new Date(q.createdAt).toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        tr.innerHTML = `
          <td data-label="Client">
            <div class="client-info">
              <span class="client-name">${escapeHtml(q.name)}</span>
              <span class="client-email">${escapeHtml(q.email)}</span>
            </div>
          </td>
          <td data-label="Type">
            <span class="type-badge ${q.type.toLowerCase()}">${q.type}</span>
          </td>
          <td data-label="Exam">
            <span style="font-weight:600; color:#e2e8f0;">${escapeHtml(q.exam)}</span>
          </td>
          <td data-label="Phone">
            <span style="color:#cbd5e1; font-size:13px;">${escapeHtml(q.phone || '—')}</span>
          </td>
          <td data-label="Message">
            <div class="message-preview">${escapeHtml(q.message || '—')}</div>
          </td>
          <td data-label="Date">
            <span style="font-size:13px; color:var(--text-muted);">${dateFormatted}</span>
          </td>
          <td data-label="Status">
            <div class="status-pill status-${q.status.replace(' ', '-')}">
              <select class="status-select" onchange="updateStatus('${q.id}', this.value)">
                <option value="Pending" ${q.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="In Progress" ${q.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                <option value="Contacted" ${q.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
                <option value="Resolved" ${q.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
              </select>
            </div>
          </td>
          <td data-label="Actions">
            <div class="action-cell">
              <button class="action-btn" onclick="openDetails('${q.id}')" title="View details">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <button class="action-btn delete" onclick="deleteQuery('${q.id}')" title="Delete query">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
              </button>
            </div>
          </td>
        `;
        listEl.appendChild(tr);
      });
    }

    // Update query status via API
    async function updateStatus(id, newStatus) {
      try {
        const response = await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (!response.ok) throw new Error('Status update failed');
        
        // Update local state and re-render
        const index = localQueries.findIndex(q => q.id === id);
        if (index !== -1) {
          localQueries[index].status = newStatus;
          renderDashboard();
        }
      } catch (error) {
        console.error('Error updating status:', error);
      }
    }

    // Delete query via API
    async function deleteQuery(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;
      try {
        const response = await fetch(`${API_URL}/${id}`, {
          method: 'DELETE'
        });
        if (!response.ok) throw new Error('Delete failed');
        
        localQueries = localQueries.filter(q => q.id !== id);
        renderDashboard();
      } catch (error) {
        console.error('Error deleting query:', error);
      }
    }

    // Show details in Modal
    function openDetails(id) {
      const q = localQueries.find(item => item.id === id);
      if (!q) return;

      const dateFormatted = new Date(q.createdAt).toLocaleString();

      const modalContent = document.getElementById('modal-content');
      modalContent.innerHTML = `
        <div class="modal-field">
          <div class="modal-field-label">Type &amp; Subject</div>
          <div class="modal-field-value"><span class="type-badge ${q.type.toLowerCase()}">${q.type}</span> &nbsp; <strong>${escapeHtml(q.exam)}</strong></div>
        </div>
        <div class="modal-field">
          <div class="modal-field-label">Full Name</div>
          <div class="modal-field-value">${escapeHtml(q.name)}</div>
        </div>
        <div class="modal-field">
          <div class="modal-field-label">Email Address</div>
          <div class="modal-field-value">${escapeHtml(q.email)}</div>
        </div>
        <div class="modal-field">
          <div class="modal-field-label">Phone Number</div>
          <div class="modal-field-value">${escapeHtml(q.phone || '—')}</div>
        </div>
        <div class="modal-field">
          <div class="modal-field-label">Date Submitted</div>
          <div class="modal-field-value">${dateFormatted}</div>
        </div>
        <div class="modal-field">
          <div class="modal-field-label">Message Details</div>
          <div class="modal-field-value modal-message">${escapeHtml(q.message || '—')}</div>
        </div>
      `;

      document.getElementById('modal-overlay').classList.add('active');
    }

    // Close Modal
    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    // Export local state queries to CSV
    function exportToCsv() {
      if (localQueries.length === 0) return alert('No records to export');
      
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "ID,Type,Name,Email,Phone,Subject/Exam,Message,Status,Date\n";
      
      localQueries.forEach(q => {
        const row = [
          q.id,
          q.type,
          `"${q.name.replace(/"/g, '""')}"`,
          q.email,
          q.phone || '',
          q.exam,
          `"${(q.message || '').replace(/"/g, '""')}"`,
          q.status,
          q.createdAt
        ].join(",");
        csvContent += row + "\n";
      });
      
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `scorepigo_queries_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Utility: escaping HTML
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Listeners
    document.getElementById('btn-refresh').addEventListener('click', fetchQueries);
    document.getElementById('btn-export').addEventListener('click', exportToCsv);
    document.getElementById('search').addEventListener('input', renderDashboard);
    document.getElementById('filter-type').addEventListener('change', renderDashboard);
    document.getElementById('filter-status').addEventListener('change', renderDashboard);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    // Initial load
    fetchQueries();
  </script>
</body>
</html>
